<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"><title>Port Energy ERP</title>
<style>
  html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,sans-serif;background:#F1F4FB;color:#121B54}
  body{display:grid;place-items:center;text-align:center}
  .c{max-width:360px;padding:24px}
  h1{font-size:22px;margin:18px 0 6px} p{color:#5D6894;margin:0 0 22px;line-height:1.5}
  button{border:0;border-radius:12px;padding:12px 26px;font-weight:700;font-size:15px;color:#fff;cursor:pointer;background:linear-gradient(120deg,#F3026E,#1B2F9E 70%,#0089F5)}
  .dot{width:56px;height:56px;margin:auto;border-radius:50%;border:4px solid #E3E8F5;border-top-color:#F3026E}
</style></head>
<body><div class="c"><div class="dot"></div><h1>No internet connection</h1><p>Port Energy ERP needs internet. Connect to Wi-Fi or mobile hotspot and try again.</p>
<button id="b">Try again</button></div>
<script>
  var u = new URLSearchParams(location.search).get('u') || 'https://balajijayabal0-pixel.github.io/portenergy-erp/app/';
  document.getElementById('b').onclick = function () { location.href = u; };
  window.addEventListener('online', function () { location.href = u; });
</script></body></html>
